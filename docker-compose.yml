services:
  postgres:
    image: postgres:16-alpine
    container_name: labrecha-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-finarg}
      POSTGRES_USER: ${DB_USERNAME:-finarg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finarg123}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - labrecha-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-finarg}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: web
    depends_on:
      api-py:
        condition: service_healthy
    environment:
      LABRECHA_API_INTERNAL_URL: http://api-py:8000
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - labrecha-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api-py:
    build:
      context: ./api-py
      dockerfile: Dockerfile
    image: labrecha-api
    container_name: labrecha-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USERNAME:-finarg}:${DB_PASSWORD:-finarg123}@postgres:5432/${DB_NAME:-finarg}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - labrecha-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    image: labrecha-scraper
    profiles:
      - scraper
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USERNAME:-finarg}:${DB_PASSWORD:-finarg123}@postgres:5432/${DB_NAME:-finarg}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-30}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-labrecha-scraper/0.1 (+https://labrecha.ar)}
    networks:
      - labrecha-network
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  labrecha-network:
    driver: bridge
