; Config para autorear migraciones a mano desde shared/:
;   alembic -c alembic.ini revision --autogenerate -m "descripcion"
; En runtime las migraciones se aplican con `labrecha-scraper db upgrade`,
; que arma la config programáticamente (labrecha_db.migrate) y no lee este archivo.

[alembic]
script_location = labrecha_db/migrations
sqlalchemy.url = postgresql+psycopg2://labrecha:labrecha123@localhost:5432/labrecha

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
