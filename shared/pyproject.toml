[project]
name = "labrecha-db"
version = "0.1.0"
description = "La Brecha - modelos SQLAlchemy y migraciones Alembic compartidos por el scraper y la API"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
migrations = ["alembic>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["labrecha_db*"]

[tool.setuptools.package-data]
labrecha_db = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
