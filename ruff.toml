line-length = 100
target-version = "py312"

[lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "EXE",
  "ISC",
  "ICN",
  "LOG",
  "G",
  "INP",
  "PIE",
  "T20",
  "PYI",
  "PT",
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SIM",
  "TID",
  "INT",
  "ARG",
  "PTH",
  "ERA",
  "PL",
  "TRY",
  "FLY",
  "PERF",
  "FURB",
  "RUF",
  "ANN",
]
ignore = [
  "ANN401",
  "COM812",
  "TRY003",
  "B008",
  "S101",
]

[lint.per-file-ignores]
"api-py/tests/*.py" = ["INP001", "PLR2004", "SLF001"]
# conftest fija DATABASE_URL antes de que nadie importe labrecha_api: la app arma su engine
# al importarse, así que el import de la app tiene que quedar diferido dentro del fixture.
"api-py/tests/conftest.py" = ["INP001", "PLC0415", "PLR2004", "SLF001"]
"shared/labrecha_db/migrations/versions/*.py" = ["INP001"]
"scraper/labrecha_scraper/cli.py" = ["T201"]
"scraper/labrecha_scraper/base.py" = ["BLE001"]
"scraper/labrecha_scraper/llm.py" = ["S603"]

[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-args = 8
