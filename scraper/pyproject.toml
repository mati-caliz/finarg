[project]
name = "labrecha-scraper"
version = "0.1.0"
description = "La Brecha - ingesta de indicadores económicos y políticos de Argentina a PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
labrecha-scraper = "labrecha_scraper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["labrecha_scraper*"]
