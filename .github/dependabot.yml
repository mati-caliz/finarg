version: 2

# Actualizaciones automáticas de dependencias.
# Nota sobre las 2 alertas residuales de `next`: apuntan a un fix que hoy sólo existe
# en release pre-stable (canary/preview 16.3.x); no se mete un pre-release en prod, así
# que se limpian solas cuando salga el 16.3 stable. Acá se ignora sólo el salto de major
# (17.x) para no abrir PRs disruptivos; los minor/patch de la línea 16.x entran agrupados.

updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      root-tooling:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/api-py"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/scraper"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
